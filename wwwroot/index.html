<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vĩnh Khánh Tour Guide</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
  :root {
    --primary: #c0392b;
    --primary-dark: #962d22;
    --bg: #fafafa;
    --card-bg: #ffffff;
    --text: #2c2c2c;
    --muted: #777;
    --border: #e3e3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #language-select {
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    font-size: 0.9rem;
  }
  .auth-btn {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .auth-btn:hover {
    background: rgba(255,255,255,0.3);
  }
  .user-display {
    font-size: 0.85rem;
    padding: 4px 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
  }
  #map {
    height: 60vh;
    min-height: 350px;
    width: 100%;
    position: relative;
    z-index: 1;
    background-color: #f0f0f0;
    border-bottom: 2px solid var(--border);
  }
  /* Leaflet popup z-index fix */
  .leaflet-popup-content-wrapper {
    background: white;
    border-radius: 8px;
  }
  .leaflet-popup-content {
    margin: 12px;
  }
  #status-bar {
    padding: 10px 16px;
    font-size: 0.9rem;
    color: var(--muted);
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  #now-playing {
    margin: 12px 16px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: none;
  }
  #now-playing.active { display: block; }
  #now-playing h3 {
    margin: 0 0 6px;
    color: var(--primary-dark);
    font-size: 1.05rem;
  }
  #now-playing p {
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--text);
  }
  audio { width: 100%; }

  #qr-section {
    margin: 12px 16px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  #qr-section h3 { margin: 0 0 8px; font-size: 1rem; }
  #qr-reader { width: 100%; max-width: 360px; margin-top: 10px; }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn:hover { background: var(--primary-dark); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 16px;
  }

  /* Auth Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 30px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .modal h2 {
    margin: 0 0 20px;
    color: var(--primary);
    font-size: 1.3rem;
    text-align: center;
  }
  .modal-tabs {
    display: flex;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border);
  }
  .modal-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .modal-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
    font-size: 0.9rem;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
  }
  .modal .btn {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
  }
  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--muted);
  }
  .modal-close:hover { color: var(--text); }
  .auth-message {
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 0.9rem;
    display: none;
  }
  .auth-message.error {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
    display: block;
  }
  .auth-message.success {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
    display: block;
  }
</style>
</head>
<body>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">&times;</button>
    <h2 id="modal-title">Đăng nhập</h2>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchTab('login', this)">Đăng nhập</div>
      <div class="modal-tab" onclick="switchTab('register', this)">Đăng ký</div>
    </div>
    <div id="auth-message" class="auth-message"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="login-username" required placeholder="Nhập tên đăng nhập">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" required placeholder="Nhập mật khẩu">
      </div>
      <button type="submit" class="btn" id="login-btn">Đăng nhập</button>
    </form>
    <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="reg-username" required placeholder="Nhập tên đăng nhập">
      </div>
      <div class="form-group">
        <label>Email (tùy chọn)</label>
        <input type="email" id="reg-email" placeholder="Nhập email">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="reg-password" required placeholder="Nhập mật khẩu">
      </div>
      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="reg-confirm" required placeholder="Nhập lại mật khẩu">
      </div>
      <button type="submit" class="btn" id="register-btn">Đăng ký</button>
    </form>
  </div>
</div>

<header>
  <h1>🍜 Vĩnh Khánh Tour Guide</h1>
  <div class="header-actions">
    <select id="language-select">
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="en">🇬🇧 English</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="zh">🇨🇳 中文</option>
    </select>
    <div id="auth-section">
      <a href="#" class="auth-btn" onclick="openAuthModal('login')">Đăng nhập</a>
      <a href="#" class="auth-btn" onclick="openAuthModal('register')">Đăng ký</a>
    </div>
    <div id="user-section" style="display:none;align-items:center;gap:8px;">
      <span class="user-display" id="user-display"></span>
      <a href="/admin.html" class="auth-btn" id="admin-link" style="display:none;">Quản trị</a>
      <button class="auth-btn" onclick="logout()">Đăng xuất</button>
    </div>
  </div>
</header>

<div id="status-bar">Đang chờ định vị GPS...</div>

<div id="map">
  <div id="map-loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;text-align:center;z-index:1000;">
    <div style="font-size:24px;">🗺️</div>
    <div style="font-size:14px;margin-top:8px;">Đang tải bản đồ...</div>
  </div>
</div>

<div id="now-playing">
  <h3 id="np-title">—</h3>
  <p id="np-desc"></p>
  <audio id="np-audio" controls></audio>
</div>

<!--
  KHU VỰC QR CODE (TV3 / Người-B hoàn thiện ở đây)
  Yêu cầu: dùng thư viện html5-qrcode, sau khi quét được ID,
  gọi hàm window.playPoiById(id) bên dưới để phát audio,
  hàm này đã tự xử lý override cooldown.
-->
<div id="qr-section">
  <h3>📷 Quét QR thuyết minh chủ động</h3>
  <button class="btn" id="qr-toggle-btn">Bật camera quét QR</button>
  <div id="qr-reader"></div>
</div>

<footer>Đồ án môn C# — Thuyết minh tự động đa ngôn ngữ phố ẩm thực Vĩnh Khánh</footer>

<script>
const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:5555' : `${window.location.protocol}//${window.location.hostname}:5555`;

// ====== AUTH FUNCTIONS (Global - outside DOMContentLoaded) ======
function openAuthModal(tab) {
  document.getElementById('auth-modal').classList.add('active');
  switchTab(tab);
}

function closeAuthModal() {
  document.getElementById('auth-modal').classList.remove('active');
}

function switchTab(tab, el) {
  const tabs = document.querySelectorAll('.modal-tab');
  tabs.forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');

  if (tab === 'login') {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('modal-title').textContent = 'Đăng nhập';
  } else {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.getElementById('modal-title').textContent = 'Đăng ký';
  }
  hideAuthMessage();
}

function showAuthMessage(text, type) {
  const msg = document.getElementById('auth-message');
  msg.textContent = text;
  msg.className = `auth-message ${type}`;
}

function hideAuthMessage() {
  document.getElementById('auth-message').style.display = 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  hideAuthMessage();
  
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';

  try {
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok && data.token) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showAuthMessage('Đăng nhập thành công!', 'success');
      setTimeout(() => {
        closeAuthModal();
        updateAuthUI();
      }, 500);
    } else {
      showAuthMessage(data.message || 'Đăng nhập thất bại', 'error');
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    }
  } catch (err) {
    showAuthMessage('Lỗi kết nối server', 'error');
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  hideAuthMessage();
  
  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  const btn = document.getElementById('register-btn');

  if (password !== confirm) {
    showAuthMessage('Mật khẩu xác nhận không khớp', 'error');
    return;
  }

  if (password.length < 6) {
    showAuthMessage('Mật khẩu phải có ít nhất 6 ký tự', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Đang đăng ký...';

  try {
    const res = await fetch(`${API_BASE}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email })
    });

    const data = await res.json();

    if (res.ok) {
      showAuthMessage('Đăng ký thành công! Vui lòng đăng nhập.', 'success');
      setTimeout(() => {
        switchTab('login', null);
        document.getElementById('login-username').value = username;
        btn.disabled = false;
        btn.textContent = 'Đăng ký';
      }, 1000);
    } else {
      showAuthMessage(data.message || 'Đăng ký thất bại', 'error');
      btn.disabled = false;
      btn.textContent = 'Đăng ký';
    }
  } catch (err) {
    showAuthMessage('Lỗi kết nối server', 'error');
    btn.disabled = false;
    btn.textContent = 'Đăng ký';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  updateAuthUI();
}

function updateAuthUI() {
  const token = localStorage.getItem('token');
  const user = localStorage.getItem('user');
  const authSection = document.getElementById('auth-section');
  const userSection = document.getElementById('user-section');
  const adminLink = document.getElementById('admin-link');

  if (token && user) {
    try {
      const userData = JSON.parse(user);
      authSection.style.display = 'none';
      userSection.style.display = 'flex';
      document.getElementById('user-display').textContent = `👤 ${userData.username}`;
      
      if (adminLink) {
        adminLink.style.display = userData.role === 'Admin' ? 'inline-block' : 'none';
      }
    } catch (e) {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      authSection.style.display = 'flex';
      userSection.style.display = 'none';
      if (adminLink) adminLink.style.display = 'none';
    }
  } else {
    authSection.style.display = 'flex';
    userSection.style.display = 'none';
    if (adminLink) adminLink.style.display = 'none';
  }
}

// ====== MAP & OTHER DOM FUNCTIONS ======
window.addEventListener('DOMContentLoaded', function() {
    const mapContainer = document.getElementById('map');
    
    // Force container có kích thước
    mapContainer.style.height = '60vh';
    mapContainer.style.minHeight = '300px';
    mapContainer.style.width = '100%';
    mapContainer.style.display = 'block';
    
    // Khởi tạo map
    const map = L.map('map', {
      center: [10.7595, 106.6965],
      zoom: 17,
      preferCanvas: true
    });
    
    // Tile layer - dùng CartoDB (đáng tin cậy hơn ở Việt Nam)
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19,
      subdomains: 'abcd'
    }).on('tileerror', function(error) {
      console.error('Tile load error:', error);
    }).addTo(map);

    console.log('Map initialized at Vinh Khanh, Q4, TP.HCM');

    // Ẩn loading indicator khi map ready
    map.whenReady(function() {
      const loadingEl = document.getElementById('map-loading');
      if (loadingEl) loadingEl.style.display = 'none';
    });

    let userMarker = null;
    const poiMarkers = {};

  // ====== 2. ĐA NGÔN NGỮ (UI TEXT) ======
  // Người-B mở rộng object này khi cần thêm chữ trên giao diện.
  const I18N = {
    vi: { waiting: "Đang chờ định vị GPS...", inRange: (n) => `Bạn đang ở gần: ${n}` , outRange: "Không có điểm nào gần bạn." },
    en: { waiting: "Waiting for GPS location...", inRange: (n) => `You are near: ${n}`, outRange: "No point of interest nearby." },
    ko: { waiting: "GPS 위치를 기다리는 중...", inRange: (n) => `근처 위치: ${n}`, outRange: "근처에 명소가 없습니다." },
    zh: { waiting: "正在等待GPS定位...", inRange: (n) => `您靠近: ${n}`, outRange: "附近没有景点。" }
  };

  let currentLang = "vi";

  function getPoiDescriptionByLang(poi, lang) {
    if (lang === 'vi') {
      const audioVi = poi?.audios?.find(a => a.languageCode === 'vi');
      return (audioVi && audioVi.transcriptText && audioVi.transcriptText.trim() !== "") ? audioVi.transcriptText : poi.description;
    }
    const audio = poi?.audios?.find(a => a.languageCode === lang);
    if (audio && audio.transcriptText && audio.transcriptText.trim() !== "") {
      return audio.transcriptText;
    }
    const msgs = { en: "Description not available in English.", ko: "이 언어로 된 설명이 없습니다.", zh: "此语言没有可用的说明。" };
    return msgs[lang] || "Chưa có bản dịch.";
  }

  function updateAllMarkerPopups() {
    if (typeof allPois === 'undefined') return;
    allPois.forEach(poi => {
      const marker = poiMarkers[poi.id];
      if (marker) {
        const localizedDesc = getPoiDescriptionByLang(poi, currentLang) || '';
        const shortDesc = localizedDesc.length > 60 ? localizedDesc.substring(0, 60) + '...' : localizedDesc;
        
        marker.setPopupContent(`
          <div style="text-align:center;min-width:200px;">
            <strong style="font-size:14px;">${poi.name}</strong>
            ${shortDesc ? `<p style="margin:6px 0;font-size:12px;color:#666;">${shortDesc}</p>` : ''}
            
            <!-- Mã QR cho điện thoại quét bằng Camera thường / Zalo -->
            <div style="margin: 12px 0;">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(window.location.origin + window.location.pathname + '?poi=' + poi.id)}" 
                   alt="QR Code" 
                   style="border: 2px solid #e0e0e0; border-radius: 8px; padding: 5px; background: white;" />
              <div style="font-size: 11px; color: #555; margin-top: 5px; font-weight: bold;">
                📱 Dùng Camera thường/Zalo quét mã này
              </div>
            </div>

            <button onclick="window.playPoiById(${poi.id})" style="background:#c0392b;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;width:100%;margin-top:4px;">
              🔊 Nghe trực tiếp tại đây
            </button>
          </div>
        `);
      }
    });
  }

  document.getElementById('language-select').addEventListener('change', (e) => {
    currentLang = e.target.value;
    document.getElementById('status-bar').textContent = I18N[currentLang].waiting;
    updateAllMarkerPopups();
  });

  // ====== 3. COOLDOWN CHỐNG SPAM ÂM THANH ======
  let lastPlayedPoiId = null;
  let cooldownActive = false;
  const COOLDOWN_MS = 30000; // 30 giây, có thể chỉnh khi demo

  // ======== 7. PHÁT AUDIO HOẶC ĐỌC TTS ========
  const audioEl = document.getElementById('np-audio');
  
  let ttsUnlocked = false;
  // Bật mồi TTS ở lần chạm đầu tiên để vượt rào bảo mật trên điện thoại
  document.body.addEventListener('touchstart', function() {
    if (!ttsUnlocked && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0; // Đọc thầm để mở khóa
      window.speechSynthesis.speak(u);
      ttsUnlocked = true;
    }
  }, { once: true });

  // Phát Audio hoặc TTS
  function renderNowPlaying(poi, audioUrl, transcriptText) {
    // Dừng audio đang phát (nếu có) trước khi nạp audio mới, tránh tiếng đè tiếng
    // khi quét QR liên tiếp hoặc đi qua điểm mới trong lúc audio cũ chưa hết.
    audioEl.pause();
    audioEl.currentTime = 0;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();

    document.getElementById('now-playing').classList.add('active');
    document.getElementById('np-title').textContent = poi.name;
    const textToSpeak = transcriptText || poi.description;
    document.getElementById('np-desc').textContent = textToSpeak;
    
    if (audioUrl) {
      audioEl.style.display = 'block';
      audioEl.src = audioUrl;
      audioEl.play().catch(() => {/* trình duyệt có thể chặn autoplay, người dùng bấm play thủ công */});
    } else {
      audioEl.style.display = 'block';
      
      // Sử dụng API Tts nội bộ của chúng ta để Google không thể chặn
      const ttsLang = currentLang === 'vi' ? 'vi' : currentLang;
      const internalTtsUrl = `${API_BASE}/api/Tts?text=${encodeURIComponent(textToSpeak)}&lang=${ttsLang}`;
      
      audioEl.src = internalTtsUrl;
      audioEl.play().catch(e => {
        console.warn("Autoplay bị chặn, cần người dùng bấm Play thủ công:", e);
      });
    }
    
    // --- ĐOẠN CODE BẮN TÍN HIỆU CỘNG ĐIỂM ---
    fetch(`${API_BASE}/api/Analytics/increment/${poi.id}?lang=${currentLang}`, { 
        method: 'POST' 
    })
    .then(res => console.log(`Đã gửi thống kê: Điểm #${poi.id}, Tiếng: ${currentLang}`))
    .catch(err => console.error("Lỗi gửi thống kê:", err));
  }

  // Hàm dùng chung: gọi khi GPS kích hoạt HOẶC khi quét QR (QR sẽ override cooldown)
  function triggerAudio(data, { overrideCooldown = false } = {}) {
    if (!data.triggered) return;

    if (!overrideCooldown) {
      if (cooldownActive && data.poi.id === lastPlayedPoiId) return; // đang cooldown, bỏ qua
    }

    lastPlayedPoiId = data.poi.id;
    
    // Xóa thông báo "chưa có audio" nếu có
    const container = document.getElementById('now-playing');
    const noAudioNotice = container.querySelector('.no-audio-notice');
    if (noAudioNotice) noAudioNotice.remove();
    
    // Hiện audio player nếu bị ẩn
    const audioEl = document.getElementById('np-audio');
    audioEl.style.display = 'block';
    
    renderNowPlaying(data.poi, data.audioUrl, data.transcriptText);
    document.getElementById('status-bar').textContent = I18N[currentLang].inRange(data.poi.name);

    if (!overrideCooldown) {
      cooldownActive = true;
      setTimeout(() => { cooldownActive = false; }, COOLDOWN_MS);
    }
  }

  // ====== 5. GỌI API GEOFENCE THEO GPS THỜI GIAN THỰC ======
  function checkLocation(lat, lng) {
    fetch(`${API_BASE}/api/location/check?lat=${lat}&lng=${lng}&lang=${currentLang}`)
      .then(res => {
        if (!res.ok) throw new Error(`API trả lỗi HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        if (data.triggered) {
          triggerAudio(data, { overrideCooldown: false });
        } else {
          document.getElementById('status-bar').textContent = I18N[currentLang].outRange;
        }
      })
      .catch(err => console.error("Lỗi gọi API location/check:", err));
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((pos) => {
      const { latitude, longitude } = pos.coords;

      if (!userMarker) {
        userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("Vị trí của bạn");
      } else {
        userMarker.setLatLng([latitude, longitude]);
      }

      checkLocation(latitude, longitude);
    }, (err) => {
      console.error("Lỗi GPS:", err);
      document.getElementById('status-bar').textContent = "Không lấy được vị trí GPS. Hãy cấp quyền định vị.";
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
  }

  // ====== 6. HIỂN THỊ TẤT CẢ POI LÊN BẢN ĐỒ ======
  // Lưu danh sách POI để dùng khi click marker
  let allPois = [];

  fetch(`${API_BASE}/api/POI`)
    .then(res => res.json())
    .then(pois => {
      allPois = pois;
      pois.forEach(poi => {
        // Tạo marker với popup hiển thị tên và nút nghe
        const marker = L.marker([poi.lat, poi.lng]).addTo(map);
        
        // Popup với nút "Nghe thuyết minh"
        const localizedDesc = getPoiDescriptionByLang(poi, currentLang) || '';
        const shortDesc = localizedDesc.length > 60 ? localizedDesc.substring(0, 60) + '...' : localizedDesc;
        marker.bindPopup(`
          <div style="text-align:center;min-width:200px;">
            <strong style="font-size:14px;">${poi.name}</strong>
            ${shortDesc ? `<p style="margin:6px 0;font-size:12px;color:#666;">${shortDesc}</p>` : ''}
            
            <!-- Mã QR cho điện thoại quét bằng Camera thường / Zalo -->
            <div style="margin: 12px 0;">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(window.location.origin + window.location.pathname + '?poi=' + poi.id)}" 
                   alt="QR Code" 
                   style="border: 2px solid #e0e0e0; border-radius: 8px; padding: 5px; background: white;" />
              <div style="font-size: 11px; color: #555; margin-top: 5px; font-weight: bold;">
                📱 Dùng Camera thường/Zalo quét mã này
              </div>
            </div>

            <button onclick="window.playPoiById(${poi.id})" style="background:#c0392b;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;width:100%;margin-top:4px;">
              🔊 Nghe trực tiếp tại đây
            </button>
          </div>
        `);
        
        // Click vào marker -> phát audio ngay (override cooldown)
        marker.on('click', function() {
          window.playPoiById(poi.id);
        });
        
        poiMarkers[poi.id] = marker;
      });
      console.log(`Đã tải ${pois.length} điểm POI`);
      
      // Kiểm tra URL xem có param ?poi=... không (do quét QR bằng app ngoài)
      const urlParams = new URLSearchParams(window.location.search);
      const poiParam = urlParams.get('poi');
      if (poiParam && !isNaN(poiParam)) {
          console.log(`Đang tự động phát POI từ QR Code: ${poiParam}`);
          // Timeout một chút để đảm bảo DOM đã sẵn sàng
          setTimeout(() => {
              window.playPoiById(parseInt(poiParam));
          }, 500);
      }
    })
    .catch(err => console.error("Lỗi tải danh sách POI:", err));

  // ====== 7. HÀM DÙNG CHO QR CODE (Người-B gọi hàm này sau khi quét được ID) ======
  // Override cooldown = true => luôn phát, bất kể đang trong thời gian chờ GPS
  window.playPoiById = function (poiId) {
    fetch(`${API_BASE}/api/POI/${poiId}`)
      .then(res => {
        if (!res.ok) throw new Error(`Không tìm thấy POI #${poiId} (HTTP ${res.status})`);
        return res.json();
      })
      .then(poi => {
        const audio = poi.audios?.find(a => a.languageCode === currentLang)
                   || poi.audios?.find(a => a.languageCode === "vi")
                   || poi.audios?.[0];

        if (!audio) {
          // Không có audio -> hiển thị thông tin POI
          showPoiInfo(poi);
          return;
        }

        triggerAudio({
          triggered: true,
          poi: poi,
          audioUrl: audio.audioUrl,
          transcriptText: audio.transcriptText
        }, { overrideCooldown: true });
      })
      .catch(err => {
        console.error("Lỗi lấy POI theo ID (QR):", err);
        alert(`Lỗi khi tải điểm #${poiId}: ${err.message}`);
      });
  };

  // ====== 7B. HIỂN THỊ THÔNG TIN POI (khi chưa có audio) ======
  window.showPoiInfo = function (poi) {
    const container = document.getElementById('now-playing');
    const titleEl = document.getElementById('np-title');
    const descEl = document.getElementById('np-desc');
    const audioEl = document.getElementById('np-audio');
    
    // Hiển thị thông tin
    titleEl.textContent = poi.name;
    const textToSpeak = poi.description || 'Chưa có mô tả cho điểm này.';
    descEl.textContent = textToSpeak;
    
    // Ẩn audio player vì chưa có audio
    audioEl.style.display = 'none';
    audioEl.pause();
    audioEl.src = '';
    
    // Dừng TTS đang phát (nếu có)
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    
    // Thêm thông báo đang dùng TTS
    let noAudioNotice = container.querySelector('.no-audio-notice');
    if (!noAudioNotice) {
      noAudioNotice = document.createElement('div');
      noAudioNotice.className = 'no-audio-notice';
      noAudioNotice.style.cssText = 'margin-top:10px;padding:8px 12px;background:#e3f2fd;color:#0d47a1;border-radius:6px;font-size:12px;';
      container.appendChild(noAudioNotice);
    }
    noAudioNotice.innerHTML = '🤖 <strong>Đang đọc tự động (TTS)</strong> - Không có file audio.';
    
    // Hiện container
    container.classList.add('active');
    
    // Sử dụng API Tts nội bộ để Google không thể chặn
    const ttsLang = currentLang === 'vi' ? 'vi' : currentLang;
    const internalTtsUrl = `${API_BASE}/api/Tts?text=${encodeURIComponent(textToSpeak)}&lang=${ttsLang}`;
    
    audioEl.style.display = 'block'; // Hiện thanh audio để người dùng có thể tự bấm Play nếu bị chặn
    audioEl.src = internalTtsUrl;
    audioEl.play().catch(e => {
      console.warn("Trình duyệt chặn phát tự động, người dùng cần tự bấm nút Play", e);
    });
    
    fetch(`${API_BASE}/api/Analytics/increment/${poi.id}?lang=${currentLang}`, { method: 'POST' }).catch(e => {});
    console.log(`[INFO] POI "${poi.name}" - đang phát qua TTS Google`);

    // Cuộn đến vùng đang phát
    container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    
    console.log(`[INFO] POI "${poi.name}" - chưa có audio để phát`);
  };

// ====== 8. HOÀN THIỆN: BẬT/TẮT CAMERA QR ======
  let html5QrCode;
  let isQrReaderActive = false;

  document.getElementById('qr-toggle-btn').addEventListener('click', () => {
    // Khởi tạo đối tượng quét nếu chưa có
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("qr-reader");
    }

    if (isQrReaderActive) {
      // Đang bật -> Bấm để tắt camera
      html5QrCode.stop().then(() => {
        isQrReaderActive = false;
        document.getElementById('qr-toggle-btn').textContent = "Bật camera quét QR";
      }).catch(err => console.error("Lỗi tắt camera: ", err));
    } else {
      // Đang tắt -> Bấm để bật camera
      html5QrCode.start(
        { facingMode: "environment" }, // Ưu tiên sử dụng camera sau của điện thoại
        {
          fps: 10, // Tốc độ quét 10 khung hình/giây
          qrbox: { width: 250, height: 250 } // Khung vuông định vị QR
        },
        (decodedText, decodedResult) => {
          // XỬ LÝ KHI QUÉT THÀNH CÔNG
          const poiId = parseInt(decodedText);
          
          if (!isNaN(poiId)) {
            // 1. Tắt camera ngay lập tức để tránh quét spam nhiều lần
            html5QrCode.stop().then(() => {
              isQrReaderActive = false;
              document.getElementById('qr-toggle-btn').textContent = "Bật camera quét QR";
              
              // 2. Gọi hàm đã có sẵn để phát nhạc dựa trên ID vừa quét
              window.playPoiById(poiId);
              
            }).catch(err => console.error("Lỗi dừng camera sau khi quét: ", err));
          }
        },
        (errorMessage) => {
          // Bỏ qua cảnh báo liên tục khi camera chưa nhìn thấy mã QR
        }
      ).then(() => {
        // Cập nhật UI khi bật camera thành công
        isQrReaderActive = true;
        document.getElementById('qr-toggle-btn').textContent = "Tắt camera";
      }).catch(err => {
        console.error("Lỗi khởi động camera: ", err);
        alert("Không thể mở camera. Vui lòng kiểm tra và cấp quyền truy cập camera trên trình duyệt của bạn.");
      });
    }
  });

  // Initialize auth UI and event listeners on page load
  updateAuthUI();

  // Close modal when clicking outside
  document.getElementById('auth-modal').addEventListener('click', (e) => {
    if (e.target.id === 'auth-modal') {
      closeAuthModal();
    }
  });

  // Đăng ký Service Worker cho PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.error('Lỗi đăng ký Service Worker:', err);
      });
    });
  }

  }); // End DOMContentLoaded

  // ====== 9. SIGNALR TRACKING ======
  const visitorConnection = new signalR.HubConnectionBuilder()
      .withUrl(API_BASE + "/visitorHub")
      .withAutomaticReconnect()
      .build();

  visitorConnection.start()
      .then(() => visitorConnection.invoke("JoinAsVisitor"))
      .catch(err => console.error("SignalR Error:", err));

  // Phải join lại sau khi máy chủ khởi động lại hoặc rớt mạng
  visitorConnection.onreconnected(() => {
      visitorConnection.invoke("JoinAsVisitor").catch(console.error);
  });
</script>
</body>
